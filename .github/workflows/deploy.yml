# Test on every push/PR; deploy main to the VPS. Same shape as call-assistant's
# deploy-netcup.yml: SSH in with appleboy/ssh-action, git reset --hard to the
# pushed commit, install, restart.
name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger, so a deploy can be re-run after fixing the box.
  workflow_dispatch:

# One production deploy at a time; queue rather than cancel.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Fail fast on the runner, before anything touches production.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest -q

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS over SSH
        uses: appleboy/ssh-action@v1
        env:
          # This repo is private, so the box can't fetch anonymously the way
          # call-assistant's does. The job's own GITHUB_TOKEN (read-only, expires
          # when the job ends) is used for this one fetch and never written to disk.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          envs: GH_TOKEN,REPO,SHA
          command_timeout: 20m
          script: |
            set -euo pipefail
            APP_DIR="$HOME/Content-Marketing-Automation"
            echo "==> Deploying $SHA to $(hostname):$APP_DIR"

            if ! command -v git >/dev/null; then
              if [ "$(id -u)" -eq 0 ]; then SUDO=""; else SUDO="sudo -n"; fi
              $SUDO env DEBIAN_FRONTEND=noninteractive apt-get update -qq
              $SUDO env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git
            fi

            mkdir -p "$APP_DIR" && cd "$APP_DIR"
            if [ ! -d .git ]; then
              git init -q -b main
              git remote add origin "https://github.com/$REPO.git"
            fi

            # Git is the source of truth: force the checkout to exactly what was pushed.
            # Untracked/ignored files (.env, data/, output/, .venv/, logs/) are kept.
            git fetch -q "https://x-access-token:$GH_TOKEN@github.com/$REPO.git" "$SHA"
            git checkout -q -f -B main FETCH_HEAD

            bash scripts/deploy_remote.sh
