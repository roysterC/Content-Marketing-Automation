# Research feeds for the manual `ingest` -> `score` -> `draft` tools. They are NOT part
# of the morning run any more (that's `daily`, which researches on the web itself).
# Reddit was removed: too noisy for this audience. Any RSS/Atom feed works. `category`
# is just a label stored on each item; it does not restrict what gets drafted.
#
# Add, remove or comment out freely. Verify a feed loads before relying on it:
#   content-agent ingest --source "<name>"

sources:
  # --- Initial client focus: salons / phone-booking businesses ---
  - name: Professional Beauty (UK)
    url: https://professionalbeauty.co.uk/rss
    category: salons
  - name: Salon Today
    url: https://www.salontoday.com/rss
    category: salons

  # --- AI releases (only used when it matters to small businesses) ---
  - name: OpenAI news
    url: https://openai.com/news/rss.xml
    category: ai_news
  - name: Google AI blog
    url: https://blog.google/technology/ai/rss/
    category: ai_news
