[project]
name = "content-agent"
version = "0.1.0"
description = "Research -> draft -> visuals -> approval pipeline for Roy's AI automation services content"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.11",
    "feedparser>=6.0",
    "jinja2>=3.1",
    "pillow>=10.0",
    "playwright>=1.45",
    "pydantic-settings>=2.3",
    "python-telegram-bot>=22.0",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "typer>=0.12",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
content-agent = "content_agent.cli:app"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
content_agent = ["visuals/templates/*.html"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
